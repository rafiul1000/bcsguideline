    ];

    function getCurrentDate(){
      const now = new Date();
      return now.toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }

    const blogsWithDates = blogs.map(blog => ({
      ...blog,
      date: blog.date ? blog.date : getCurrentDate()
    }));

    /* =========================
       SAVE TO LOCAL STORAGE
    ========================== */

    localStorage.setItem("blogs", JSON.stringify(blogsWithDates));

    /* =========================
       GET BLOGS
    ========================== */

    const storedBlogs =
      JSON.parse(localStorage.getItem("blogs"));

    const blogGrid =
      document.getElementById("blogGrid");

    const itemsPerPage = 6;
    let currentPage = 1;
    let currentItems = [];
    let activeCategory = "All";
    let searchTerm = "";

    function getPaginatedItems(items, page = 1){
      const start = (page - 1) * itemsPerPage;
      return items.slice(start, start + itemsPerPage);
    }

    function renderPagination(items){
      const pagination = document.getElementById("pagination");
      const pageCount = Math.ceil(items.length / itemsPerPage);

      pagination.innerHTML = "";

      if(pageCount <= 1) return;

      for(let i = 1; i <= pageCount; i++){
        pagination.innerHTML += `
          <button class="${i === currentPage ? "active" : ""}" onclick="gotoPage(${i})">
            ${i}
          </button>
        `;
      }
    }

    function displayBlogs(items){

      blogGrid.innerHTML = "";

      items.forEach(blog => {

        const blogIndex = storedBlogs.indexOf(blog);

        blogGrid.innerHTML += `

          <div class="blog-card">

            <div class="blog-image">
              <img src="${blog.image}">
            </div>

            <div class="blog-content">

              <span class="category">
                ${blog.category}
              </span>

              <h2 class="blog-title">
                ${blog.title}
              </h2>

              <p class="blog-date">
                ${blog.date}
              </p>

              <p class="blog-description">
                ${blog.description.substring(0,120)}...
              </p>

              <div class="card-buttons">

                <button class="detail-btn"
                  onclick="openModal(${blogIndex})">
                  Read More
                </button>

              </div>

            </div>

          </div>

        `;

      });

    }

    function renderBlogs(items, page = 1){
      currentItems = items;
      currentPage = page;
      displayBlogs(getPaginatedItems(items, page));
      renderPagination(items);
    }

    function gotoPage(page){
      currentPage = page;
      displayBlogs(getPaginatedItems(currentItems, page));
      renderPagination(currentItems);
    }

    renderBlogs(storedBlogs);

    /* =========================
       SEARCH FEATURE
    ========================== */

    const searchInput =
      document.getElementById("searchInput");

    searchInput.addEventListener("keyup", () => {

      searchTerm = searchInput.value.toLowerCase();

      const filtered = storedBlogs.filter(blog =>
        (activeCategory === "All" || blog.category === activeCategory) &&
        blog.title.toLowerCase().includes(searchTerm)
      );

      renderBlogs(filtered);

    });

    /* =========================
       CATEGORY FILTER
    ========================== */

    const filterButtons =
      document.querySelectorAll(".filter-btn");

    filterButtons.forEach(btn => {

      btn.addEventListener("click", () => {

        document.querySelector(".active")
          .classList.remove("active");

        btn.classList.add("active");

        const category =
          btn.dataset.category;

        activeCategory = category;

        const filtered = storedBlogs.filter(blog =>
          (activeCategory === "All" || blog.category === activeCategory) &&
          blog.title.toLowerCase().includes(searchTerm)
        );

        renderBlogs(filtered);

      });

    });

    /* =========================
       DARK MODE
    ========================== */

    const darkBtn =
      document.getElementById("darkModeBtn");

    darkBtn.addEventListener("click", () => {

      document.body.classList.toggle("dark");

    });

    /* =========================
       BLOG DETAIL MODAL
    ========================== */

    const modal =
      document.getElementById("blogModal");

    function openModal(index){

      const blog = storedBlogs[index];

      modal.style.display = "flex";

      document.getElementById("modalImage")
        .src = blog.image;

      document.getElementById("modalCategory")
        .innerText = blog.category;

      document.getElementById("modalTitle")
        .innerText = blog.title;

      document.getElementById("modalDate")
        .innerText = blog.date;

      document.getElementById("modalDescription")
        .innerText = blog.description;

    }

    document.getElementById("closeModal")
      .addEventListener("click", () => {

        modal.style.display = "none";

      });

    window.addEventListener("click", e => {

      if(e.target === modal){

        modal.style.display = "none";

      }

    });

  </script>
